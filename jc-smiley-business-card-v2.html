<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JC Smiley | MyVillage</title>

  <!--
    FONTS
    Fraunces: a warm, humanist serif with real character — used sparingly for the
    name/headline so the card has a distinct "voice" instead of a generic system font.
    Inter: a clean, highly-legible sans-serif for everything else (body text, links).
  -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    /* ==========================================================================
       DESIGN TOKENS
       Centralizing the palette, type, spacing and shadows here means every rule
       below refers back to a single source of truth — change a value once,
       and it updates everywhere it's used.
       ========================================================================== */
    :root {
      /* -- Color palette (updated to the requested brand system) ------------- */
      --color-bg: #F5EFE4;          /* warm cream page background */
      --color-card: #FBF8F1;        /* slightly lighter card surface for contrast */
      --color-ink: #3A342C;         /* dark ink text on the cream background */
      --color-ink-soft: #6F675C;    /* softened ink for taglines / secondary text */
      --color-accent: #C1694F;      /* muted terra / burnt orange accent */
      --color-accent-soft: #8A9A7E; /* warm sage support color for rings and subtle fills */
      --color-border: #D9CDB7;      /* hairline borders / dividers */

      /* -- Type scale ------------------------------------------------------------ */
      --font-display: 'Fraunces', Georgia, serif;
      --font-body: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;

      /* -- Shape & shadow --------------------------------------------------------- */
      --radius-card: 28px;
      --shadow-card: 0 20px 60px -20px rgba(51, 66, 47, 0.25), 0 4px 16px -4px rgba(51, 66, 47, 0.08);
      --shadow-photo: 0 8px 24px -6px rgba(51, 66, 47, 0.35);
    }

    /* ==========================================================================
       RESET / BASE
       A light reset so margins and box-sizing behave predictably across browsers.
       ========================================================================== */
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-body);
      color: var(--color-ink);
      background: var(--color-bg);

      /* Centers the card both horizontally AND vertically in the viewport */
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;

      /* Breathing room on small screens so the card never touches the edges */
      padding: 24px;
    }

    /* ==========================================================================
       SIGNATURE BACKGROUND TEXTURE
       A few faint, oversized "ripple" rings echo the profile-photo rings and the
       idea of a village — concentric circles of support radiating outward.
       Purely decorative, so it's marked aria-hidden and ignored by screen readers.
       ========================================================================== */
    .ambient-rings {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .ambient-rings::before,
    .ambient-rings::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      border: 1px solid var(--color-border);
    }

    .ambient-rings::before {
      width: 900px;
      height: 900px;
      top: -320px;
      left: -320px;
    }

    .ambient-rings::after {
      width: 700px;
      height: 700px;
      bottom: -280px;
      right: -280px;
    }

    /* ==========================================================================
       CARD CONTAINER
       The single "business card" — rounded corners, soft shadow, generous
       internal padding. Everything else lives inside this.
       ========================================================================== */
    .card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 380px;
      background: var(--color-card);
      border-radius: var(--radius-card);
      box-shadow: var(--shadow-card);
      padding: 48px 32px 40px;

      /* Stack + center every child */
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    /* ==========================================================================
       1. PROFILE PHOTO SECTION
       Circular photo with a soft double-ring "village" motif behind it and a
       gentle shadow to lift it off the card.
       ========================================================================== */
    .photo-wrap {
      position: relative;
      width: 150px;
      height: 150px;
      margin-bottom: 28px;
    }

    /* The faint outer ring — echoes the "circle of support" idea from MyVillage */
    .photo-wrap::before {
      content: "";
      position: absolute;
      inset: -12px;
      border-radius: 50%;
      border: 1.5px solid var(--color-accent-soft);
    }

    .profile-photo {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      object-fit: cover;
      display: block;

      /* Subtle border + shadow so the circle reads clearly against the card */
      border: 4px solid var(--color-card);
      outline: 1px solid var(--color-border);
      box-shadow: var(--shadow-photo);
    }

    /* ==========================================================================
       2 & 3. NAME + BUSINESS NAME
       H1 for the person's name (primary heading), H2 directly beneath it for
       the business name — semantically correct heading hierarchy.
       ========================================================================== */
    .name {
      font-family: var(--font-display);
      font-weight: 600;
      font-size: clamp(1.75rem, 5vw, 2.1rem);
      line-height: 1.15;
      margin: 0 0 4px;
      color: var(--color-ink);
    }

    .business-name {
      font-family: var(--font-body);
      font-weight: 600;
      font-size: 1rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--color-accent);
      margin: 0 0 18px;
    }

    /* ==========================================================================
       4. TAGLINE
       Smaller, lighter weight, softer color — clearly secondary to the name.
       ========================================================================== */
    .tagline {
      font-size: 0.95rem;
      font-weight: 400;
      line-height: 1.6;
      color: var(--color-ink-soft);
      max-width: 26ch;
      margin: 0 0 32px;
    }

    /* Thin divider that separates the "identity" block from the logo/contact block */
    .divider {
      width: 48px;
      height: 1px;
      background: var(--color-border);
      border: none;
      margin: 0 0 32px;
    }

    /* ==========================================================================
       5. LOGO SECTION
       A distinct section (not the same image as the profile photo) for the
       business/brand logo. Kept small and understated — a supporting mark,
       not competing with the name above it.
       ========================================================================== */
    .logo-section {
      margin-bottom: 32px;
    }

    .brand-logo {
      width: 64px;
      height: 64px;
      object-fit: contain;
      display: block;
      opacity: 0.9;
    }

    /* ==========================================================================
       6. CONTACT INFO — PILL STYLE (v2)
       Phone and email are each rendered as a rounded, "pill" shaped chip with
       a small icon. Email is a real mailto: link so it opens the user's mail
       client; phone is a tel: link so it's tappable on mobile too.
       ========================================================================== */
    .contact {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      width: 100%;
    }

    /* The pill itself — shared by both phone and email */
    .contact-pill {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      max-width: 280px;
      padding: 12px 20px;
      border-radius: 999px; /* fully rounded = pill shape */

      background: var(--color-accent-soft);
      border: 1px solid transparent;

      font-family: var(--font-body);
      font-size: 0.92rem;
      font-weight: 500;
      color: var(--color-ink);
      text-decoration: none;

      transition: background-color 0.2s ease, border-color 0.2s ease,
                  transform 0.2s ease, box-shadow 0.2s ease;
    }

    /* Icon inside the pill inherits the accent color for a bit of contrast */
    .contact-pill svg {
      flex: none;
      width: 18px;
      height: 18px;
      color: var(--color-accent);
    }

    .contact-pill span {
      /* Keeps long email addresses from breaking the pill's rounded shape */
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* Hover / focus: pill lifts slightly and firms up its border, echoing the
       "quiet hover effect" from v1 but adapted to a solid-background pill */
    .contact-pill:hover,
    .contact-pill:focus-visible {
      background: #fff;
      border-color: var(--color-accent);
      transform: translateY(-2px);
      box-shadow: 0 8px 20px -8px rgba(51, 66, 47, 0.28);
    }

    /* Clear, visible keyboard focus state for accessibility */
    .contact-pill:focus-visible {
      outline: 2px solid var(--color-accent);
      outline-offset: 3px;
    }

    /* ==========================================================================
       FOOTER
       A tiny closing line — optional, but gives the card a natural bottom edge.
       ========================================================================== */
    .card-footer {
      margin-top: 32px;
      font-size: 0.75rem;
      letter-spacing: 0.04em;
      color: var(--color-ink-soft);
      opacity: 0.7;
    }

    /* ==========================================================================
       RESPONSIVE ADJUSTMENTS
       The card already scales via max-width + fluid clamp() type, but we
       tighten padding a touch on very small phones.
       ========================================================================== */
    @media (max-width: 380px) {
      .card {
        padding: 40px 24px 32px;
      }
    }

    /* Respect users who've asked for reduced motion */
    @media (prefers-reduced-motion: reduce) {
      * {
        transition: none !important;
      }
    }
  </style>
</head>
<body>

  <!-- Decorative ambient rings behind the card; purely visual -->
  <div class="ambient-rings" aria-hidden="true"></div>

  <!-- MAIN CARD: the entire business card lives inside this single <main> element -->
  <main class="card">

    <!-- 1. PROFILE PHOTO -->
    <header class="photo-wrap">
      <img
        class="profile-photo"
        src="images/jcsmiley.jpg"
        alt="Profile photo of JC Smiley"
        width="150"
        height="150"
      >
    </header>

    <!-- 2 & 3 & 4. NAME / BUSINESS NAME / TAGLINE -->
    <section aria-label="Identity">
      <h1 class="name">JC Smiley</h1>
      <h2 class="business-name">MyVillage</h2>
      <p class="tagline">Every new mother deserves support from day one</p>
    </section>

    <hr class="divider">

    <!-- 5. LOGO SECTION (separate from the profile photo above) -->
    <section class="logo-section" aria-label="Brand logo">
      <img
        class="brand-logo"
        src="images/tsm_logo.png"
        alt="MyVillage logo"
        width="64"
        height="64"
      >
    </section>

    <!-- 6. CONTACT INFO — phone and email as tappable "pill" chips -->
    <section class="contact" aria-label="Contact information">

      <!-- Phone pill: tel: link makes it tappable on mobile -->
      <a class="contact-pill" href="tel:1112223333">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/>
        </svg>
        <span>111-222-3333</span>
      </a>

      <!-- Email pill: mailto: link opens the user's mail client -->
      <a class="contact-pill" href="mailto:jsmiley@persevere.org">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 4h16v16H4z" opacity="0"/>
          <path d="M22 6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V6z"/>
          <path d="m2 7 8.97 6.02a2 2 0 0 0 2.06 0L22 7"/>
        </svg>
        <span>jsmiley@persevere.org</span>
      </a>
    </section>

    <footer class="card-footer">MyVillage &middot; Community support for new mothers</footer>

  </main>

  <script>
    // ==========================================================================
    // JAVASCRIPT
    // No functionality is strictly required for a static business card, but a
    // couple of small, unobtrusive touches make the page feel polished and
    // give you a template for adding more interactivity later.
    // ==========================================================================

    document.addEventListener('DOMContentLoaded', function () {

      // 1) Log a friendly confirmation once everything is loaded — useful when
      //    you're testing the page and want to confirm the script ran at all.
      console.log('MyVillage business card loaded.');

      // 2) Give the email link a tiny "copied a hint" nicety: if someone
      //    long-presses/right-clicks or just wants a quick confirmation, this
      //    logs the action to the console (safe, non-intrusive, no popups).
      var emailLink = document.querySelector('.contact-pill[href^="mailto:"]');
      if (emailLink) {
        emailLink.addEventListener('click', function () {
          console.log('Opening mail client for jsmiley@persevere.org');
        });
      }
    });
  </script>

</body>
</html>
